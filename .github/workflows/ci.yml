name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Script syntax
        run: for script in Scripts/*.sh; do zsh -n "$script"; done
      - name: Documentation links
        run: python3 Scripts/check-docs.py
      - name: Tests (no API credentials)
        run: swift test
      - name: Release build
        run: swift build -c release
